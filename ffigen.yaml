# Run with `dart run ffigen --config ffigen.yaml`.
name: LuaDartBindings
description: |
  Generated bindings for the stable lua_dart C ABI in src/lua_dart.h.
  Do not edit by hand.
output: 'lib/src/lua_dart_bindings_generated.dart'
headers:
  entry-points:
    - 'src/lua_dart.h'
  include-directives:
    - 'src/lua_dart.h'
ffi-native:
  asset-id: 'package:lua_dart/lua_dart_bindings_generated.dart'
functions:
  # Leaf calls cannot call back into Dart. These functions never allocate
  # through the collector and never run Lua code, so they cannot reach a
  # host function or a finalizer.
  leaf:
    include:
      - 'luadart_abi_version'
      - 'luadart_registry_index'
      - 'luadart_memory_used'
      - 'luadart_set_memory_limit'
      - 'luadart_interrupt'
      - 'luadart_clear_interrupt'
      - 'luadart_gettop'
      - 'luadart_settop'
      - 'luadart_absindex'
      - 'luadart_pushvalue'
      - 'luadart_rotate'
      - 'luadart_copy'
      - 'luadart_type'
      - 'luadart_isinteger'
      - 'luadart_isnumber'
      - 'luadart_isstring'
      - 'luadart_is_host_function'
      - 'luadart_toboolean'
      - 'luadart_tointegerx'
      - 'luadart_tonumberx'
      - 'luadart_tolstring'
      - 'luadart_rawlen'
      - 'luadart_rawequal'
      - 'luadart_tothread'
      - 'luadart_status'
      - 'luadart_pushnil'
      - 'luadart_pushboolean'
      - 'luadart_pushinteger'
      - 'luadart_pushnumber'
      - 'luadart_pushglobaltable'
      - 'luadart_rawget'
      - 'luadart_rawgeti'
comments:
  style: any
  length: full
