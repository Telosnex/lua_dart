include: package:lints/recommended.yaml

analyzer:
  # Its own package, with lua_dardo_plus from a sibling checkout.
  exclude:
    - test/perf/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
