name: lua_dart
description: >-
  The reference Lua 5.5 for Dart and Flutter, with an API in the style of the
  Lua C API: dart:ffi on native platforms, WebAssembly on the web. Memory
  limits and interrupts.
version: 1.0.0
repository: https://github.com/Telosnex/lua_dart
issue_tracker: https://github.com/Telosnex/lua_dart/issues

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.2.0
  kiln: ^1.0.0

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.28.0
